<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C578" />
      <stop offset="50%" stop-color="#C8A44E" />
      <stop offset="100%" stop-color="#9A7828" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222238" />
      <stop offset="100%" stop-color="#12121f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#C8A44E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Luxury Diamond Architectural Crest -->
  <rect x="56" y="56" width="400" height="400" rx="90" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glow)"/>

  <!-- Subtle Inner Inset Border -->
  <rect x="78" y="78" width="356" height="356" rx="72" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 6"/>

  <!-- Architectural Villa Gabled Roof Line -->
  <path d="M176 172 L256 120 L336 172" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="102" r="8" fill="url(#goldGrad)"/>

  <!-- Sophisticated Monogram 'S' -->
  <path d="M316 226 C304 204 282 192 254 192 C214 192 186 218 186 250 C186 288 222 302 264 316 C308 330 330 348 330 382 C330 422 294 448 248 448 C204 448 174 426 164 394"
        fill="none" stroke="url(#goldGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Luxury Accent Diamonds -->
  <polygon points="256,462 262,470 256,478 250,470" fill="url(#goldGrad)"/>
</svg>